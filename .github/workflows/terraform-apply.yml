# Terraform apply on merge to main (T26): dev first, then prod behind a manual approval, and the
# dashboard deployed after every apply.
#
#   dev             apply infra/envs/dev, then deploy its page
#   prod-preflight  refuse to go on unless the GitHub Environments "prod-plan" and "prod" exist
#                   with their protection rules (GitHub creates a missing environment, with NO
#                   rules, the first time a job names it)
#   prod-plan       plan prod and show it in the job summary   (environment prod-plan: main only)
#   prod-apply      after a required reviewer approves: plan again, refuse if anything differs
#                   from the reviewed plan, apply, deploy prod's page   (environment prod)
#
# Skips cleanly (no failure) until the user has set it up (infra/envs/README.md, "CI/CD"): each
# environment's jobs need its three repository variables, and CI applies an environment only
# after a person has done its first full apply (runbook step 8; `stack-is-up`). dev's project
# does not exist yet (D1), so until DEV_* is set the dev job is skipped and prod goes alone.
#
# Authentication is Workload Identity Federation only: no key is stored in GitHub. prod's
# deployer is additionally reachable only from jobs in those two environments (bootstrap's
# github_environments condition), so the approval is enforced by GitHub and Google, not just by
# this file.
#
# Two applies of one environment never overlap: every job that writes an environment's state is
# in the concurrency group terraform-state-<env>, shared with the nightly destroy (and the GCS
# backend's state lock is the second guard). Plan files are never uploaded as artifacts: a
# binary plan holds every sensitive value in clear, so each apply job plans for itself.

name: Terraform apply

on:
  push:
    branches: [main]

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.2"
  # The dashboard (web/) needs Node 22.12 or newer (web/package.json "engines").
  NODE_VERSION: "22.23.4"

jobs:
  dev:
    name: Apply dev, deploy its page
    if: >-
      github.ref == 'refs/heads/main'
      && vars.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      && vars.DEV_GCP_DEPLOYER_SA != ''
      && vars.DEV_TF_STATE_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: terraform-state-dev
      cancel-in-progress: false # never stop an apply half-way
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.DEV_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEV_GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
      - name: Fetch dev's tfvars from the state bucket
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 infra/envs/ci/tf_ci.py fetch-tfvars --env dev
      - run: python3 infra/envs/ci/tf_ci.py init --env dev
      - id: up
        run: python3 infra/envs/ci/tf_ci.py stack-is-up --env dev
      - name: Apply dev
        if: steps.up.outputs.up == 'true'
        run: python3 infra/envs/ci/tf_ci.py apply --env dev
      # After every apply: a Terraform change to the rewrite or the headers reaches the site only
      # with a deploy (phr README, "Deploying the page").
      - name: Deploy dev's page
        if: steps.up.outputs.up == 'true'
        run: python3 infra/envs/ci/tf_ci.py deploy-page --env dev

  prod-preflight:
    name: Check prod's GitHub Environments
    if: >-
      github.ref == 'refs/heads/main'
      && vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      && vars.PROD_GCP_DEPLOYER_SA != ''
      && vars.PROD_TF_STATE_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # GET /repos/{owner}/{repo}/environments/{name} needs Actions: read
    steps:
      - name: Require the protection rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail=0
          for name in prod-plan prod; do
            if ! gh api "repos/${REPO}/environments/${name}" > "${RUNNER_TEMP}/${name}.json"; then
              echo "::error::GitHub Environment '${name}' does not exist. Create it first (infra/envs/README.md, \"CI/CD\")."
              fail=1
              continue
            fi
            if [ "$(jq '.deployment_branch_policy != null' "${RUNNER_TEMP}/${name}.json")" != "true" ]; then
              echo "::error::Environment '${name}' must allow deployments from selected branches (main) only."
              fail=1
            fi
          done
          if [ -f "${RUNNER_TEMP}/prod.json" ] && \
             [ "$(jq '[.protection_rules[]?.type] | index("required_reviewers") != null' "${RUNNER_TEMP}/prod.json")" != "true" ]; then
            echo "::error::Environment 'prod' must have required reviewers: they are the manual gate before a prod apply."
            fail=1
          fi
          exit "${fail}"

  prod-plan:
    name: Plan prod
    needs: [dev, prod-preflight]
    # prod goes ahead when dev succeeded or was skipped (dev not configured yet, D1), never after
    # a dev failure.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      && vars.PROD_GCP_DEPLOYER_SA != ''
      && vars.PROD_TF_STATE_BUCKET != ''
      && needs.prod-preflight.result == 'success'
      && (needs.dev.result == 'success' || needs.dev.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub applies the environment's rules (main only) before the job starts, and only then puts
    # `environment: prod-plan` into the OIDC token that prod's Workload Identity condition requires.
    environment: prod-plan
    concurrency:
      group: terraform-state-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      up: ${{ steps.up.outputs.up }}
      digest: ${{ steps.plan.outputs.digest }}
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_STATE_BUCKET: ${{ vars.PROD_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
      - name: Fetch prod's tfvars from the state bucket
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 infra/envs/ci/tf_ci.py fetch-tfvars --env prod
      - run: python3 infra/envs/ci/tf_ci.py init --env prod
      - id: up
        run: python3 infra/envs/ci/tf_ci.py stack-is-up --env prod
      # The redacted plan goes to this job's summary, where the reviewer reads it before approving.
      - id: plan
        if: steps.up.outputs.up == 'true'
        run: python3 infra/envs/ci/tf_ci.py plan --env prod

  prod-apply:
    name: Apply prod (after approval), deploy its page
    needs: prod-plan
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      && vars.PROD_GCP_DEPLOYER_SA != ''
      && vars.PROD_TF_STATE_BUCKET != ''
      && needs.prod-plan.result == 'success'
      && needs.prod-plan.outputs.up == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The manual gate: the job waits until one of the environment's required reviewers approves.
    environment: prod
    concurrency:
      group: terraform-state-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.PROD_TF_STATE_BUCKET }}
      REVIEWED_DIGEST: ${{ needs.prod-plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
      - name: Fetch prod's tfvars from the state bucket
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 infra/envs/ci/tf_ci.py fetch-tfvars --env prod
      - run: python3 infra/envs/ci/tf_ci.py init --env prod
      # Re-plans and applies only if exactly the reviewed resources would change.
      - name: Apply prod
        run: python3 infra/envs/ci/tf_ci.py apply --env prod --expect-digest "${REVIEWED_DIGEST}"
      - name: Deploy prod's page
        run: python3 infra/envs/ci/tf_ci.py deploy-page --env prod
