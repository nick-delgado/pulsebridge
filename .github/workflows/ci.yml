# Continuous integration: runs on every pull request (and on pushes to main) and fails the check
# if linting, tests, Terraform validation, the secret scan or the pre-commit hooks fail. Each job
# calls the same Makefile targets a developer runs locally.
#
# No step or job may use continue-on-error: a failing check must fail the run.
# tests/tooling/test_ci_workflow.py enforces this and the other properties CI depends on.
#
# Third-party actions are pinned to a full commit SHA (the tag is in the trailing comment): a tag
# can be moved to different code, a commit SHA cannot.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  TERRAFORM_VERSION: "1.17.2"
  # Go builds two tools from source: gitleaks v8.30.1 (needs Go 1.24.11 or newer) and the
  # actionlint pre-commit hook v1.7.12 (needs Go 1.25.0 or newer). setup-go sets GOTOOLCHAIN=local,
  # so Go will not download a newer toolchain by itself: this version must satisfy both. Raise it
  # when either tool is upgraded.
  GO_VERSION: "1.25.9"

jobs:
  lint-and-test:
    name: Lint and test (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The tooling tests drive `make tf-validate`, the pre-commit hooks and `make secret-scan`, so
      # they need terraform, and Go to build gitleaks.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make install
      - run: make lint
      - run: make test

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make tf-validate

  # Scans the commits themselves for credentials. The pre-commit gitleaks hook only checks what is
  # staged on the developer's machine, so it misses a commit made with `--no-verify` or from a
  # clone without hooks; this job does not depend on hooks having run.
  secret-scan:
    name: Secret scan (gitleaks over commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the base commit and every pull request commit exist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Pull request: only the commits it adds (reachable from its head, not from its base).
      # Push to main: the whole history. SHAs go through env, not inline ${{ }} in the script.
      - name: Scan commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            make secret-scan SECRET_SCAN_RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            make secret-scan SECRET_SCAN_RANGE=HEAD
          fi

  # Runs every hook over all files (ruff, actionlint, YAML/TOML checks, terraform fmt,
  # detect-private-key). The gitleaks hook finds nothing to scan here because nothing is staged
  # in a CI checkout; committed secrets are covered by the secret-scan job above.
  pre-commit:
    name: Pre-commit hooks (all files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make pre-commit
