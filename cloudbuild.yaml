# Cloud Build: builds every service image (services/*/Dockerfile), pushes it to Artifact Registry
# and prints the digests to paste into terraform.tfvars. See services/README.md
# ("Container images") for the trigger, the build service account and the cost.
#
# Meant to run on a git tag (a release), from a Cloud Build trigger such as
#   tag pattern ^v[0-9]+\.[0-9]+\.[0-9]+$ , config file cloudbuild.yaml
# The trigger is a Terraform resource that is not part of this task (see the README).
# A manual run of the same build, from the repository root:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions TAG_NAME=v0.1.0,COMMIT_SHA="$(git rev-parse HEAD)" .
#
# Nothing here names a deployment. The project is Cloud Build's own PROJECT_ID; the region and
# repository names are the substitutions below, whose defaults are the `project-base` module's
# defaults. Override them on the trigger or with --substitutions.
#
# No secrets: the build reads none and the images contain none. Pushing uses the build service
# account's own credentials, which Cloud Build provides to the docker client.

substitutions:
  # Region of the Artifact Registry repositories (project-base `region`).
  _REGION: us-central1
  # Docker repository for the service images (project-base `docker_repository_id`).
  _REPOSITORY: pulsebridge-services
  # Docker Hub pull-through cache that the base image is pulled through
  # (project-base `dockerhub_mirror_repository_id`). Set it to an empty string when the module
  # runs with create_dockerhub_mirror = false: the base image then comes straight from Docker Hub.
  _DOCKERHUB_MIRROR: pulsebridge-dockerhub

options:
  # The `script` below reads every substitution as an environment variable (no $$ escaping).
  automapSubstitutions: true
  # Logs go to Cloud Logging only, which a user-specified build service account requires (there
  # is no logs bucket to grant it access to).
  logging: CLOUD_LOGGING_ONLY

steps:
  # One step, one script: build, push and report each image in turn. The Docker builder image is
  # pinned by digest (tag 29 = Docker 29), so the build does not change under us; bump it the same
  # way as the base image (services/README.md).
  - id: build-push-report
    name: gcr.io/cloud-builders/docker:29@sha256:4faf2620ae4f5710ef66c2a7b2fcaa58589df6fe413ed6c19b675925346bb000
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      # --- inputs -------------------------------------------------------------------------------
      # TAG_NAME is set by a tag trigger. A tag is pushed once: the services repository has
      # immutable tags (project-base), so a second build of the same tag is refused at push.
      if [[ ! "${TAG_NAME:-}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
        echo "TAG_NAME must be a valid image tag; run this build from a tag trigger" >&2
        exit 1
      fi
      if [[ ! "${COMMIT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
        echo "COMMIT_SHA must be a full 40-character commit SHA" >&2
        exit 1
      fi
      for name in PROJECT_ID _REGION _REPOSITORY; do
        if [[ -z "${!name:-}" ]]; then
          echo "substitution ${name} is empty" >&2
          exit 1
        fi
      done

      registry="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}"
      # The Dockerfiles pin the base image by digest; only the registry it is pulled from changes.
      if [[ -n "${_DOCKERHUB_MIRROR:-}" ]]; then
        base_registry="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_DOCKERHUB_MIRROR}"
      else
        base_registry="docker.io"
      fi

      # --- every service with a Dockerfile -------------------------------------------------------
      shopt -s nullglob
      dockerfiles=(services/*/Dockerfile)
      if (( ${#dockerfiles[@]} == 0 )); then
        echo "no services/*/Dockerfile found" >&2
        exit 1
      fi

      tfvars=()
      for dockerfile in "${dockerfiles[@]}"; do
        service="$(basename "$(dirname "${dockerfile}")")"
        image="${registry}/${service}"
        echo "=== ${service}: building ${image}:${TAG_NAME}"
        # Context is the repository root (the Dockerfiles copy from libs/). Cloud Run runs
        # linux/amd64. No provenance attestation: the pushed digest is then a plain image
        # manifest, the simplest thing for Cloud Run and Terraform to reference.
        docker build \
          --file "${dockerfile}" \
          --platform linux/amd64 \
          --provenance=false \
          --build-arg "PYTHON_REGISTRY=${base_registry}" \
          --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
          --label "org.opencontainers.image.version=${TAG_NAME}" \
          --tag "${image}:${TAG_NAME}" \
          --tag "${image}:${COMMIT_SHA}" \
          .
        docker push "${image}:${TAG_NAME}"
        docker push "${image}:${COMMIT_SHA}"
        # The digest as the registry stores it: this is what Cloud Run pulls.
        digest="$(docker buildx imagetools inspect "${image}:${TAG_NAME}" --format '{{.Manifest.Digest}}')"
        if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "could not read the digest of ${image}:${TAG_NAME}" >&2
          exit 1
        fi
        echo "=== ${service}: ${image}@${digest}"
        tfvars+=("${service//-/_}_image = \"${image}@${digest}\"")
      done

      # --- the lines to paste into infra/envs/<env>/terraform.tfvars -----------------------------
      echo "----- BEGIN tfvars (${TAG_NAME}, ${COMMIT_SHA}) -----"
      printf '%s\n' "${tfvars[@]}"
      echo "----- END tfvars -----"
