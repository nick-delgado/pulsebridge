# v2-to-fhir: Pub/Sub push handler that maps stored HL7v2 ORU^R01 messages to FHIR (task T12).
# See README.md.

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pulsebridge-v2-to-fhir"
version = "0.1.0"
description = "Maps HL7v2 ORU^R01 blood-pressure messages from the HL7v2 store to FHIR R4 and records an application-level outcome per message."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # The repository's own libraries (libs/). They are not on PyPI: install them from libs/ first
  # (`make install` does, in that order; the container build in T24 must too). They are left
  # unpinned because they are versioned with this repository.
  "pulsebridge-fhir",
  "pulsebridge-hl7v2",
  "pulsebridge-gcp",
  # Third-party, exact pins (CLAUDE.md).
  # Flask: the most widely known small Python web framework; one route, a JSON body, a status.
  "Flask==3.1.3",
  # gunicorn: the production WSGI server (Flask's own server is for development only).
  "gunicorn==26.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["v2_to_fhir"]
