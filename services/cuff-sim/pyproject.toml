# cuff-sim: the cuff simulator backend (task T13). Builds an HL7v2 ORU^R01 from one
# blood-pressure reading, sends it over MLLP or HTTPS ingest, returns the store's ACK and records
# the attempt as a FHIR AuditEvent. See README.md.

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pulsebridge-cuff-sim"
version = "0.1.0"
description = "Cuff simulator backend: sends a blood-pressure reading as HL7v2 ORU^R01 over MLLP or HTTPS ingest and records every attempt as a FHIR AuditEvent."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # The repository's own libraries (libs/). They are not on PyPI: install them from libs/ first
  # (`make install` does; the container build in T24 must too). Unpinned because they are
  # versioned with this repository.
  "pulsebridge-fhir",
  "pulsebridge-hl7v2",
  "pulsebridge-gcp",
  # Third-party, exact pins (CLAUDE.md). The same framework and server as v2-to-fhir (T12).
  "Flask==3.1.3",
  "gunicorn==26.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cuff_sim"]
